[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certified-shell-company-screening-agent"
version = "1.0.0"
description = "Reusable certified research workflow for shell company screening"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
hk = ["akshare>=1.16.0", "pandas>=2.0.0", "requests>=2.31.0", "beautifulsoup4>=4.12.0", "pdfplumber>=0.11.0", "openpyxl>=3.1.0"]
test = ["pytest>=7.0"]

[project.scripts]
shell-screen-agent = "shell_company_screening_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
