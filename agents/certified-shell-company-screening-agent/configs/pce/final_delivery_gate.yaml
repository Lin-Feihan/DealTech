final_delivery_gate:
  enabled: true
  material_claim_reference_pattern: "CLM-[A-Z]+-[0-9]{5}"
  required_delivery_files:
    - delivery/tuntun_hk_case_study.md
    - delivery/top_candidate_dd_review_pack.md
  allowed_external_statuses:
    - Certified
    - Certified with Caveat
  blocked_statuses:
    - Internal Trace Only
    - Needs Human Review
    - Not Certified
  require_explicit_claim_references: true
  require_referenced_claims_in_claim_map: true
  require_referenced_claims_in_pce_audit: true
  block_on_unreferenced_material_delivery: true
