risk_review_rules:
  enabled: true
  high_severity_external_effect: "Needs Human Review"
  medium_unknown_external_effect: "Certified with Caveat"
  unresolved_risk_flags:
    - unknown
    - unresolved
    - needs_review
  blocking_risk_flags:
    - legal_blocker
    - regulatory_blocker
    - suspension_confirmed
    - audit_qualification_confirmed
