pce_policy_rules:
  enabled: true
  statuses:
    certified: "Certified"
    certified_with_caveat: "Certified with Caveat"
    internal_trace_only: "Internal Trace Only"
    needs_human_review: "Needs Human Review"
    not_certified: "Not Certified"
  delivery_scope:
    external_final:
      allow_statuses:
        - Certified
        - Certified with Caveat
      block_statuses:
        - Internal Trace Only
        - Needs Human Review
        - Not Certified
    internal_trace:
      allow_statuses:
        - Internal Trace Only
        - Certified
        - Certified with Caveat
      block_statuses:
        - Needs Human Review
        - Not Certified
  principle: "生成并不等于许可；final delivery requires claim-level PCE status derived from upstream trace."
