stage: hard_filter
purpose: "Internal ER/BRB decisioning for noisy first-pass shell-company screening evidence."
principle: "ER/BRB may escalate or downgrade confidence, but must never override a binding hard exclusion gate into pass."
inputs:
  required_tables:
    - candidate_universe_table.csv
    - hard_filter_table.csv
    - er_brb_scoring_table.csv
    - exclusion_reason_table.csv
  evidence_sources:
    AKSHARE_HK_SNAPSHOT_CACHE:
      reliability: 0.60
      allowed_use: "first-pass structured market screening only"
      limitation: "not sufficient for external final conclusions without HKEX/filing verification"
    HKEXNEWS_OFFICIAL:
      reliability: 0.92
      allowed_use: "official disclosure verification"
    COMPANY_FILINGS:
      reliability: 0.88
      allowed_use: "financial facts, audit opinions, control path"
belief_states:
  pass:
    description: "Evidence supports retaining candidate for DD."
    min_belief: 0.65
  watchlist:
    description: "Mixed evidence; keep candidate but require DD escalation."
    min_belief: 0.45
  exclude:
    description: "Hard or soft evidence supports exclusion."
  insufficient_evidence:
    description: "Missing official source, conflicting signal, or metadata-only evidence."
  confidence_buffer:
    description: "Residual uncertainty retained rather than forced into pass/exclude."
hard_exclusion_gates:
  - de_spac_or_recent_spac_uncleared
  - ultra_low_market_cap_rule_failed
  - toxic_convertible_or_death_spiral_flag
  - suspended_or_non_current_reporting
  - unresolved_major_regulatory_or_legal_risk
  - initial_control_feasibility_failed
aggregation_logic:
  method: "weighted evidential reasoning"
  steps:
    - "Normalize source reliability by source type and recency."
    - "Map each filter signal to pass/watchlist/exclude/insufficient-evidence belief mass."
    - "Apply hard exclusion gates before soft aggregation."
    - "Aggregate remaining belief masses with source reliability weights."
    - "Calibrate confidence downward for missing official evidence, stale source, metadata-only source, or contradiction."
confidence_calibration:
  base_confidence: 0.70
  penalties:
    missing_hkex_verification: 0.25
    metadata_only_evidence: 0.20
    conflicting_filter_signals: 0.20
    stale_source: 0.10
    single_non_official_source: 0.15
  thresholds:
    pass_min_confidence: 0.55
    watchlist_min_confidence: 0.40
    dd_escalation_below: 0.55
missing_evidence_handling:
  action: "DD escalation"
  human_review_required: true
  pce_effect: "Needs Human Review unless explicitly scoped as internal trace only"
conflicting_evidence_handling:
  action: "watchlist or DD escalation"
  human_review_required: true
  pce_effect: "Certified with Caveat or Needs Human Review depending on delivery scope"
outputs:
  columns:
    - decision_output
    - requires_dd_escalation
    - evidence_gap_note
    - uncertainty_label
    - human_review_required
