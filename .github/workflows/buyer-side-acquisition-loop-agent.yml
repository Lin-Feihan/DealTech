name: Buyer-side Acquisition Loop Agent

on:
  push:
    paths:
      - "agents/agents/buyer-side-acquisition-loop-agent/**"
      - "agents/agents/buyer_side_acquisition_loop_agent/**"
      - "agents/dealtech_certification/**"
      - "scripts/verify_buyer_side_agent_release.py"
      - "pyproject.toml"
      - ".github/workflows/buyer-side-acquisition-loop-agent.yml"
  pull_request:
    paths:
      - "agents/agents/buyer-side-acquisition-loop-agent/**"
      - "agents/agents/buyer_side_acquisition_loop_agent/**"
      - "agents/dealtech_certification/**"
      - "scripts/verify_buyer_side_agent_release.py"
      - "pyproject.toml"
      - ".github/workflows/buyer-side-acquisition-loop-agent.yml"

jobs:
  deterministic-release-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install editable project and tests
        run: python -m pip install -e ".[test]"
      - name: Compile new package
        run: python -m compileall -q agents/agents/buyer_side_acquisition_loop_agent
      - name: Run focused deterministic and recorded tests
        run: >-
          python -m pytest -q
          agents/agents/buyer-side-acquisition-loop-agent/tests/test_release_candidate_1.py
          agents/agents/buyer-side-acquisition-loop-agent/tests/test_milestone_6_complete_block_a_provider.py
          agents/agents/buyer-side-acquisition-loop-agent/tests/test_milestone_7_complete_block_b.py
          agents/agents/buyer-side-acquisition-loop-agent/tests/test_milestone_8_complete_block_c.py
      - name: Recorded full-pipeline smoke test
        run: >-
          buyer-side-acquisition-loop
          --case agents/agents/buyer-side-acquisition-loop-agent/06_examples/recorded_full_pipeline_case/case.yaml
          --module FULL_PIPELINE
          --output "${{ runner.temp }}/buyer-side-acquisition-loop-run"
      - name: Validate curated sample and release contract
        run: python scripts/verify_buyer_side_agent_release.py

# Live-provider execution is intentionally absent. This workflow uses no API secret
# and makes no network research request.
