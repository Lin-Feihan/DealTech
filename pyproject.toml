[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealtech-buyer-side-acquisition-loop-agent"
version = "0.1.0rc1"
description = "Runnable buyer-side acquisition research, gate, loop and certification pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
live = ["openai>=1.0"]
test = ["pytest>=8.0"]

[project.scripts]
buyer-side-acquisition-loop = "buyer_side_acquisition_loop_agent.cli:main"

[tool.setuptools]
packages = ["buyer_side_acquisition_loop_agent", "dealtech_certification"]

[tool.setuptools.package-dir]
buyer_side_acquisition_loop_agent = "agents/agents/buyer_side_acquisition_loop_agent"
dealtech_certification = "agents/dealtech_certification"

[tool.pytest.ini_options]
testpaths = ["agents/agents/buyer-side-acquisition-loop-agent/tests"]
